name: Release Package Asset

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package-and-attach:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Detect lockfile
        id: lockfile
        run: |
          if [[ -f package-lock.json ]]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Node.js (with npm cache)
        if: steps.lockfile.outputs.exists == 'true'
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Setup Node.js (without npm cache)
        if: steps.lockfile.outputs.exists != 'true'
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Install dependencies (npm ci)
        if: steps.lockfile.outputs.exists == 'true'
        run: npm ci

      - name: Install dependencies (npm install)
        if: steps.lockfile.outputs.exists != 'true'
        run: npm install

      - name: Run tests
        run: npm test

      - name: Build package
        run: npm run build

      - name: Create npm tarball
        id: pack
        run: |
          FILE_NAME=$(npm pack --json --ignore-scripts | node -e "const fs=require('fs'); const input=fs.readFileSync(0,'utf8'); const result=JSON.parse(input); process.stdout.write(result[0].filename);")
          echo "file_name=$FILE_NAME" >> "$GITHUB_OUTPUT"

      - name: Upload tarball to release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ github.event.release.tag_name }}
          FILE_NAME: ${{ steps.pack.outputs.file_name }}
        run: gh release upload "$TAG_NAME" "$FILE_NAME" --clobber
